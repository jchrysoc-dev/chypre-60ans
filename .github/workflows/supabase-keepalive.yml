# Supabase pauses free projects after 7 days without activity, which would break logins.
# This calls a tiny database function (public.ping) every 3 days. Needs repository secrets SUPABASE_URL and
# SUPABASE_PUBLISHABLE_KEY (GitHub → Settings → Secrets and variables → Actions).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call public.ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Secrets not set yet; skipping."; exit 0; fi
          curl --fail --silent --show-error --output /dev/null -X POST \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/ping"
